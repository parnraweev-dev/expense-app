<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการค่าใช้จ่ายในบ้าน</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    /* ===== Flip7 design system — colors ===== */
    --teal:#2BA8A2;
    --teal-light:#3CC4BD;
    --teal-dark:#1E8C86;
    --teal-bg:#E8F6F5;
    --gold:#FFD23F;
    --gold-light:#FFE47A;
    --gold-dark:#E6B800;
    --coral:#EF6C4A;
    --coral-light:#FF8A6A;
    --coral-dark:#D45233;
    --cream:#FFF8E7;
    --sky:#5DADE2;
    --success:#27AE60;
    --error:#E74C3C;

    /* App-level aliases kept so existing inline styles (var(--green)/var(--red)/var(--muted)/etc.)
       generated by JS continue to resolve correctly after the re-skin. */
    --bg:#EFF8F7; --card:#FFFFFF; --border:#D9EEEC; --text:#1E8C86; --muted:#5E8C89;
    --primary:var(--teal); --primary-dark:var(--teal-dark); --accent:var(--teal-bg);
    --green:var(--success); --red:var(--coral-dark); --yellow:var(--gold);

    /* ===== Typography ===== */
    --font-display:36px; --font-h1:24px; --font-h2:18px; --font-h3:16px;
    --font-body:14px; --font-sm:12px; --font-xs:10px;

    /* ===== Spacing ===== */
    --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px;

    /* ===== Radius ===== */
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-round:999px;
    --radius:var(--r-lg);

    /* ===== Elevation — colored glow system ===== */
    --shadow-sm:0 1px 4px rgba(0,0,0,.08);
    --shadow-md:0 2px 8px rgba(0,0,0,.12);
    --shadow-lg:0 4px 16px rgba(0,0,0,.16);
    --shadow-card:0 2px 10px rgba(43,168,162,.10);
    --shadow-coral-glow:0 2px 10px rgba(239,108,74,.35);
    --shadow-teal-glow:0 2px 10px rgba(43,168,162,.30);
    --shadow-accent-glow:0 2px 10px rgba(255,210,63,.40);
    --shadow-sky-glow:0 2px 8px rgba(93,173,226,.30);
    --shadow-focus:0 0 0 3px rgba(43,168,162,.15);

    --bounce:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Sarabun","PingFang SC","Microsoft YaHei",Tahoma,sans-serif;
    background:var(--bg); color:var(--text); font-size:var(--font-body);
  }
  .layout{display:flex; min-height:100vh;}
  nav.sidebar{
    width:230px; background:var(--teal-dark); color:var(--cream); flex-shrink:0;
    padding:20px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  nav.sidebar h1{font-size:var(--font-h3); font-weight:800; letter-spacing:.3px; padding:0 20px 16px; margin:0; border-bottom:2px dashed rgba(255,248,231,.35); color:#fff;}
  nav.sidebar .tab{
    display:flex; align-items:center; gap:10px; padding:12px 20px; cursor:pointer;
    color:rgba(255,248,231,.75); font-size:13.5px; border-left:3px solid transparent;
    transition:background .15s var(--bounce), border-color .15s var(--bounce), color .15s;
  }
  nav.sidebar .tab:hover{background:rgba(255,255,255,.08); color:#fff;}
  nav.sidebar .tab.active{background:rgba(255,255,255,.1); border-left-color:var(--gold); color:#fff; font-weight:700;}
  main{flex:1; padding:28px 36px; max-width:1100px;}
  h2.page-title{margin:0 0 4px; font-size:var(--font-h1); font-weight:800; color:var(--teal-dark);}
  p.page-desc{margin:0 0 22px; color:var(--muted); font-size:13px;}
  .card{
    background:var(--card); border:none; border-left:6px solid var(--teal-light);
    border-radius:var(--radius); box-shadow:var(--shadow-card); padding:20px 22px; margin-bottom:20px;
  }
  .card h3{margin:0 0 14px; padding-bottom:10px; font-size:var(--font-h3); font-weight:800; color:var(--teal-dark); border-bottom:2px dashed var(--teal-bg);}
  .row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; color:var(--muted); font-weight:700;}
  select, input[type=text], input[type=number], input[type=password]{
    padding:8px 10px; border:2px solid var(--teal-bg); border-radius:var(--r-md); font-size:13.5px;
    font-family:inherit; background:var(--cream); color:var(--text); transition:border-color .15s, box-shadow .15s;
  }
  select:focus, input:focus{ outline:none; border-color:var(--teal-light); box-shadow:var(--shadow-focus); }
  button{
    padding:9px 20px; border-radius:var(--r-round); border:none;
    background:linear-gradient(180deg,var(--gold-light),var(--gold) 60%,var(--gold-dark));
    color:var(--teal-dark); position:relative; overflow:hidden;
    font-size:13.5px; cursor:pointer; font-weight:800; font-family:inherit;
    box-shadow:var(--shadow-accent-glow);
    transition:transform .15s var(--bounce), box-shadow .15s var(--bounce), opacity .15s;
  }
  button::before{
    content:""; position:absolute; top:0; left:0; right:0; height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
    border-radius:var(--r-round) var(--r-round) 0 0; pointer-events:none;
  }
  button:hover{ transform:translateY(-1px); }
  button:active{ transform:scale(.96); }
  button.secondary{background:var(--cream); color:var(--teal-dark); border:2px dashed var(--teal-light); box-shadow:none;}
  button.secondary::before{ content:none; }
  button.secondary:hover{background:var(--teal-bg);}
  button.danger{background:var(--coral); color:#fff; box-shadow:var(--shadow-coral-glow);}
  button.danger::before{ background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)); }
  button.danger:hover{background:var(--coral-dark);}
  button.ghost{background:transparent; color:var(--coral-dark); padding:4px 8px; box-shadow:none; font-weight:700;}
  button.ghost::before{ content:none; }
  button.ghost:hover{ transform:none; text-decoration:underline; }
  button:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}
  button:disabled:hover{ transform:none; }
  table{width:100%; border-collapse:collapse; font-size:13.2px;}
  th, td{padding:8px 10px; border-bottom:1px solid var(--teal-bg); text-align:left; vertical-align:middle;}
  th{background:var(--teal-bg); color:var(--teal-dark); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
  tr:hover td{background:#FBFEFD;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .pill{display:inline-block; padding:3px 11px; border-radius:var(--r-round); font-size:11.5px; font-weight:700; background:var(--teal-bg); color:var(--teal-dark);}
  .muted{color:var(--muted);}
  .badge-warn{background:var(--coral-light); color:#fff; padding:3px 10px; border-radius:var(--r-round); font-size:11.5px; font-weight:700;}
  .badge-ok{background:var(--gold-light); color:var(--teal-dark); padding:3px 10px; border-radius:var(--r-round); font-size:11.5px; font-weight:700;}
  .inline-edit{border:1px solid transparent; background:transparent; width:100%; font-family:inherit; font-size:13.2px; padding:3px 5px; border-radius:var(--r-sm); color:var(--text);}
  .inline-edit:focus{border-color:var(--teal-light); background:#fff; outline:none; box-shadow:none;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(30,140,134,.55); display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal{background:var(--cream); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); padding:24px 26px; width:380px; max-width:90vw;}
  .modal h3{margin:0 0 10px; color:var(--teal-dark); font-weight:800;}
  .modal p{margin:0 0 16px; color:var(--muted); font-size:13px;}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--teal-dark); color:var(--cream); padding:12px 18px;
    border-radius:var(--r-md); font-size:13px; box-shadow:var(--shadow-lg); z-index:60; opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-label{width:150px; font-size:12.8px; flex-shrink:0;}
  .bar-track{flex:1; background:var(--teal-bg); border-radius:var(--r-md); height:20px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--teal-light),var(--teal)); border-radius:var(--r-md);}
  .bar-amount{width:110px; text-align:right; font-size:12.8px; font-variant-numeric:tabular-nums; flex-shrink:0;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px;}
  .stat-card{background:var(--card); border:none; border-left:6px solid var(--gold); border-radius:var(--radius); box-shadow:var(--shadow-card); padding:16px 18px;}
  .stat-card .label{font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:700;}
  .stat-card .value{font-size:22px; font-weight:800; color:var(--teal-dark);}
  .dropzone{
    border:2px dashed var(--teal-light); border-radius:var(--radius); padding:34px; text-align:center; color:var(--muted);
    cursor:pointer; background:var(--teal-bg);
  }
  .dropzone.drag{border-color:var(--gold); background:var(--gold-light); color:var(--teal-dark); box-shadow:var(--shadow-accent-glow);}
  .file-chip{display:inline-flex; align-items:center; gap:8px; background:var(--cream); padding:6px 12px; border-radius:var(--r-round); font-size:12.5px; margin:4px 6px 0 0;}
  .empty{padding:30px; text-align:center; color:var(--muted); font-size:13px;}
  .keyword-tag{display:inline-flex; align-items:center; gap:6px; background:var(--cream); border-radius:var(--r-round); padding:3px 10px 3px 12px; font-size:12px; margin:3px 4px 0 0;}
  .keyword-tag button{background:none; color:var(--coral-dark); padding:0; font-size:14px; line-height:1; box-shadow:none;}
  .keyword-tag button::before{ content:none; }
  .small-note{font-size:12px; color:var(--muted); margin-top:6px;}
  .flex-between{display:flex; justify-content:space-between; align-items:center;}
  select.cat-select{font-size:12.5px; padding:5px 6px;}
  .checkbox-row{display:flex; align-items:center; gap:8px;}
  .checkbox-row input[type=checkbox]{ accent-color:var(--teal); width:16px; height:16px; }
  #pinGate{
    position:fixed; inset:0; background:var(--teal-dark); display:flex; align-items:center; justify-content:center; z-index:100;
  }
  #pinGate .box{background:var(--cream); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); padding:34px 30px; width:340px; max-width:90vw; text-align:center;}
  #pinGate h2{margin:0 0 6px; font-size:var(--font-h2); color:var(--teal-dark); font-weight:800;}
  #pinGate p{margin:0 0 18px; color:var(--muted); font-size:13px;}
  #pinGate input{width:100%; text-align:center; font-size:18px; letter-spacing:2px; padding:10px; margin-bottom:12px; background:#fff;}
  #pinGate button{width:100%; padding:11px;}
  #pinGate .err{color:var(--coral-dark); font-size:12.5px; min-height:16px; margin-top:8px; font-weight:700;}
  .sync-status{font-size:11.5px; padding:8px 20px 4px; color:rgba(255,248,231,.6);}
  .logout-link{padding:10px 20px 4px; font-size:12px; color:rgba(255,248,231,.6); cursor:pointer; text-decoration:underline;}
  .logout-link:hover{color:#fff;}
  .debt-timeline-row{margin-bottom:18px;}
  .debt-timeline-row:last-child{margin-bottom:0;}
  .debt-timeline-header{display:flex; justify-content:space-between; align-items:baseline; font-size:13.2px; margin-bottom:6px; gap:10px;}
  .debt-timeline-header .name{font-weight:700; color:var(--teal-dark);}
  .debt-timeline-header .finish{font-size:12px; color:var(--muted); text-align:right;}
  .debt-timeline-track{background:var(--teal-bg); border-radius:var(--r-md); height:16px; overflow:hidden; position:relative;}
  .debt-timeline-fill{height:100%; border-radius:var(--r-md); background:linear-gradient(90deg,var(--teal-light),var(--teal)); transition:width .3s;}
  .debt-timeline-fill.done{background:linear-gradient(90deg,#5FD08A,var(--success));}
  .debt-timeline-fill.unlimited{background:repeating-linear-gradient(45deg,var(--sky),var(--sky) 6px,#8FC6EA 6px,#8FC6EA 12px); width:100%;}
  .debt-timeline-meta{font-size:11.5px; color:var(--muted); margin-top:5px;}
  .finish-order-list{list-style:none; margin:0; padding:0;}
  .finish-order-list li{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--teal-bg); font-size:13px;}
  .finish-order-list li:last-child{border-bottom:none;}
  .finish-order-list .rank{width:22px; height:22px; border-radius:50%; background:var(--gold); color:var(--teal-dark); font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .finish-order-list .fname{flex:1;}
  .filter-pill{display:inline-block; padding:6px 15px; border-radius:var(--r-round); font-size:12.5px; margin:0 6px 6px 0; cursor:pointer; background:var(--cream); color:var(--text); border:2px solid transparent; user-select:none; transition:border-color .15s, transform .15s var(--bounce);}
  .filter-pill:hover{border-color:var(--teal-light);}
  .filter-pill.active{background:linear-gradient(180deg,var(--teal-light),var(--teal)); color:#fff; font-weight:700; box-shadow:var(--shadow-teal-glow); border-color:transparent;}
  .finish-order-list .fdate{font-weight:800; color:var(--teal-dark);}
</style>
</head>
<body>
<div id="pinGate">
  <div class="box">
    <h2>🔒 รหัสผ่านครอบครัว</h2>
    <p>ใส่รหัสผ่านที่ตกลงกันไว้ เพื่อเข้าดู/แก้ไขข้อมูลค่าใช้จ่ายที่ทุกคนใช้ร่วมกัน</p>
    <input type="password" id="pinInput" placeholder="รหัสผ่าน" autocomplete="off">
    <button id="pinSubmitBtn">เข้าสู่ระบบ</button>
    <div class="err" id="pinErr"></div>
  </div>
</div>
<div class="layout">
  <nav class="sidebar">
    <h1>🏠 ค่าใช้จ่ายในบ้าน</h1>
    <div class="tab active" data-tab="upload">📄 อัปโหลด Statement</div>
    <div class="tab" data-tab="summary">📊 สรุปค่าใช้จ่ายรายเดือน</div>
    <div class="tab" data-tab="debt">💳 สรุปหนี้ที่ต้องชำระ</div>
    <div class="tab" data-tab="natfinance">💰 รายรับ-รายจ่ายนัท</div>
    <div class="tab" data-tab="categories">🏷️ ตั้งค่าหมวดหมู่</div>
    <div class="tab" data-tab="debtsettings">⚙️ ตั้งค่าหนี้ประจำเดือน</div>
    <div class="tab" data-tab="history">🗂️ ประวัติทั้งหมด</div>
    <div class="sync-status" id="syncStatus"></div>
    <div class="logout-link" id="logoutLink">ออกจากระบบ / เปลี่ยนรหัสผ่าน</div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast"></div>

<script>
/* ============================= CONFIG / DEFAULTS ============================= */
const THAI_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const STORAGE_KEY = "expenseApp_v1";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const DEFAULT_CATEGORIES = [
  { id: "nat", name: "นัทคนเดียว", keywords: ["โทรศัพท์นัท","TRUE MOVE H NUT"] },
  { id: "pan", name: "ป่านคนเดียว", keywords: ["โทรศัพท์ป่าน","TRUE MOVE H PAN","KRUNGSRI บัตรป่าน","UOB"] },
  { id: "home", name: "ค่าใช้จ่ายในบ้าน", keywords: ["MAKRO","SHOPEE","TIKTOK","MEGA HOME"] },
  { id: "trip", name: "เที่ยวเล็ก", keywords: ["GRAB","EXPRESSWAY","EVST"] },
  // Special "split" category: any transaction tagged with this category is not counted
  // under its own name — its amount is divided evenly and added into the categories
  // listed in splitInto instead (here: half to นัทคนเดียว, half to ป่านคนเดียว).
  { id: "split_half", name: "รวมกันแล้วหารสอง", keywords: [], splitInto: ["nat","pan"] }
];
const SPLIT_HALF_CATEGORY_ID = "split_half";

// totalInstallments: 0 (or blank) means "ไม่จำกัดงวด" — no countdown, the item is due every month indefinitely.
// When >0, it's the total number of monthly payments; the remaining count is derived from how many
// months this item has ever been ticked "paid" (see paidMonthCount / remainingInstallments below).
const DEFAULT_DEBT_ITEMS = [
  { id: "gold_pan", name: "ผ่อนทองป่าน", amount: 0, totalInstallments: 0 },
  { id: "saving_pan", name: "ผ่อนเงินเก็บป่าน", amount: 0, totalInstallments: 0 },
  { id: "gold_miaw", name: "ผ่อนทองเงินเหมียน", amount: 0, totalInstallments: 0 },
  { id: "krungsri_pan", name: "ผ่อนกรุงศรีป่าน", amount: 0, totalInstallments: 0 },
  { id: "gsb_pan", name: "ผ่อนออมสินป่าน", amount: 0, totalInstallments: 0 },
  { id: "kbank_pan", name: "ผ่อน K Bank ป่าน", amount: 0, totalInstallments: 0 }
];

// Lines matching any of these (case-insensitive substring) are NOT transaction line items —
// they are statement headers/footers/balances/summaries and must be skipped entirely, even
// if they happen to end with a number that looks like an amount.
const DEFAULT_EXCLUDE_KEYWORDS = [
  "ยอดยกมา", "ยกมา", "ยอดคงเหลือ", "คงเหลือยกไป", "เครดิตคงเหลือ",
  "วงเงิน", "วงเงินคงเหลือ", "ยอดขั้นต่ำ", "กำหนดชำระ", "วันครบกำหนด",
  "ขอบคุณที่ชำระเงิน", "ขอบคุณ", "ยอดเรียกเก็บ", "รวมยอดเรียกเก็บ",
  "รวมทั้งสิ้น", "รวมรายการ", "สรุปยอด", "เลขที่บัญชี", "เลขที่บัตร", "หมายเลขบัตร",
  "PREVIOUS BALANCE", "NEW BALANCE", "CLOSING BALANCE", "OPENING BALANCE",
  "TOTAL DUE", "TOTAL AMOUNT DUE", "MINIMUM PAYMENT", "AVAILABLE CREDIT",
  "CREDIT LIMIT", "STATEMENT DATE", "ACCOUNT NUMBER", "ACCOUNT NO",
  "PAYMENT RECEIVED", "THANK YOU", "PAGE "
];

/* ============================= FIREBASE CONFIG ============================= */
// Paste your Firebase project config here (Firebase console → Project settings → Your apps → SDK setup).
// These values are not secret — they're meant to be public in client-side Firebase apps.
// Real protection comes from the PIN-derived room id below + Firestore security rules.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCT3X-DKhv9iz8K_-TnTWR-azydgI5SBUU",
  authDomain: "expense-app-ee4ed.firebaseapp.com",
  projectId: "expense-app-ee4ed",
  storageBucket: "expense-app-ee4ed.firebasestorage.app",
  messagingSenderId: "252373903333",
  appId: "1:252373903333:web:a62837c16779d17431f10c"
};

/* ============================= STATE / STORAGE ============================= */
function defaultState(){
  const now = new Date();
  return {
    categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
    debtItems: JSON.parse(JSON.stringify(DEFAULT_DEBT_ITEMS)),
    excludeKeywords: DEFAULT_EXCLUDE_KEYWORDS.slice(),
    months: {},           // { "2569-07": { transactions:[...], sources:[...], debtPaid:{} } }
    activeMonthKey: `${now.getFullYear()+543}-${String(now.getMonth()+1).padStart(2,"0")}`
  };
}
// Fills in any fields missing from older saved/synced data so nothing crashes after an app update.
function migrateState(parsed){
  if(!parsed || typeof parsed !== "object") return defaultState();
  if(!parsed.excludeKeywords) parsed.excludeKeywords = DEFAULT_EXCLUDE_KEYWORDS.slice();
  if(!parsed.categories) parsed.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  if(!parsed.categories.some(c=>c.id===SPLIT_HALF_CATEGORY_ID)){
    parsed.categories.push({ id: SPLIT_HALF_CATEGORY_ID, name: "รวมกันแล้วหารสอง", keywords: [], splitInto: ["nat","pan"] });
  }
  if(!parsed.debtItems) parsed.debtItems = JSON.parse(JSON.stringify(DEFAULT_DEBT_ITEMS));
  parsed.debtItems.forEach(d=>{ if(typeof d.totalInstallments !== "number") d.totalInstallments = 0; });
  if(!parsed.months) parsed.months = {};
  // Older saved months won't have natFinance (Nat's personal income/expense tracker) yet.
  Object.values(parsed.months).forEach(bucket=>{
    if(!bucket.natFinance) bucket.natFinance = { income: [], customExpenses: [] };
    if(!Array.isArray(bucket.natFinance.income)) bucket.natFinance.income = [];
    if(!Array.isArray(bucket.natFinance.customExpenses)) bucket.natFinance.customExpenses = [];
  });
  if(!parsed.activeMonthKey){
    const now = new Date();
    parsed.activeMonthKey = `${now.getFullYear()+543}-${String(now.getMonth()+1).padStart(2,"0")}`;
  }
  return parsed;
}

// state starts as a safe local placeholder so every render*() function has something valid
// to read even before the PIN is entered / the room finishes connecting to Firestore.
let state = defaultState();
let roomId = null;
let roomDocRef = null;
let saveDebounceTimer = null;

// Deterministic (not cryptographically secure) hash — turns the shared PIN into a Firestore
// document id. Anyone who knows the PIN can reach the same room; this is the "simple shared
// password" model the household chose over full accounts/logins.
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h + str.charCodeAt(i)) >>> 0; }
  return "room_" + h.toString(16);
}
function localCacheKey(rid){ return STORAGE_KEY + "_cache_" + rid; }

function setSyncStatus(text, ok){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.textContent = text;
  el.style.color = ok === true ? "#4ade80" : (ok === false ? "#f87171" : "#94a3b8");
}

// Persists a state change: instantly to the local cache (so a reload never loses anything even
// offline), and — debounced, so rapid edits don't spam the network — up to Firestore so every
// other device connected to the same room picks it up in real time via onSnapshot below.
function saveState(){
  if(roomId) localStorage.setItem(localCacheKey(roomId), JSON.stringify(state));
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{
    if(!roomDocRef) return;
    roomDocRef.set(state).then(()=>{
      setSyncStatus("✅ ซิงค์ล่าสุดเรียบร้อย", true);
    }).catch(err=>{
      console.error("Firestore save failed", err);
      setSyncStatus("⚠️ บันทึกขึ้น cloud ไม่สำเร็จ (เก็บไว้ในเครื่องนี้แล้ว)", false);
    });
  }, 400);
}

// Called once the user submits the shared PIN (or automatically on reload if it was remembered).
// Loads whatever's cached locally first (instant, works offline), then subscribes to the
// matching Firestore room document so any change from another device re-renders this one live.
function connectRoom(pin){
  roomId = simpleHash(pin.trim());
  localStorage.setItem(STORAGE_KEY + "_pin", pin.trim());

  const cacheKey = localCacheKey(roomId);
  const cached = localStorage.getItem(cacheKey);
  if(cached){
    try{ state = migrateState(JSON.parse(cached)); }catch(e){ state = defaultState(); }
  }
  hidePinGate();
  render();

  try{
    if(typeof firebase === "undefined") throw new Error("Firebase SDK not loaded");
    if(FIREBASE_CONFIG.apiKey === "REPLACE_ME"){
      setSyncStatus("⚠️ ยังไม่ได้ตั้งค่า Firebase — ใช้ข้อมูลในเครื่องนี้เท่านั้น", false);
      return;
    }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();
    roomDocRef = db.collection("rooms").doc(roomId);
    setSyncStatus("🔄 กำลังเชื่อมต่อ...", null);
    roomDocRef.onSnapshot(snap=>{
      if(snap.exists){
        state = migrateState(snap.data());
        localStorage.setItem(cacheKey, JSON.stringify(state));
      } else {
        // First time this room has ever been used — seed it with what we have locally.
        roomDocRef.set(state);
      }
      setSyncStatus("🟢 เชื่อมต่อแล้ว เห็นข้อมูลเดียวกันทุกเครื่อง", true);
      render();
    }, err=>{
      console.error("Firestore listen failed", err);
      setSyncStatus("⚠️ เชื่อมต่อ cloud ไม่สำเร็จ ใช้ข้อมูลในเครื่องนี้แทน", false);
    });
  }catch(e){
    console.error("Firebase init failed", e);
    setSyncStatus("⚠️ เชื่อมต่อ cloud ไม่สำเร็จ ใช้ข้อมูลในเครื่องนี้แทน", false);
  }
}

function monthLabel(key){
  const [y,m] = key.split("-");
  return `${THAI_MONTHS[parseInt(m,10)-1]} ${y}`;
}
function ensureMonth(key){
  if(!state.months[key]) state.months[key] = { transactions: [], sources: [], debtPaid: {}, natFinance: { income: [], customExpenses: [] } };
  if(!state.months[key].natFinance) state.months[key].natFinance = { income: [], customExpenses: [] };
  return state.months[key];
}

// Shared by both the monthly Summary tab and Nat's income/expense tab so the two screens
// can never disagree about what a category's total is. Handles the "split in half" category
// by dividing its transactions' amounts across the categories it splits into, instead of
// counting them under the split category's own name.
function computeCategoryTotals(bucket){
  const totals = {};
  let grand = 0;
  bucket.transactions.forEach(t=>{
    const cat = state.categories.find(c=>c.id===t.category);
    if(cat && cat.splitInto && cat.splitInto.length){
      const share = t.amount / cat.splitInto.length;
      cat.splitInto.forEach(targetId=>{ totals[targetId] = (totals[targetId]||0) + share; });
    } else {
      const cid = t.category || "__none";
      totals[cid] = (totals[cid]||0) + t.amount;
    }
    grand += t.amount;
  });
  return { totals, grand };
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function fmt(n){ return (Math.round((n+Number.EPSILON)*100)/100).toLocaleString("th-TH",{minimumFractionDigits:2, maximumFractionDigits:2}); }

// How many months (across the whole system, regardless of which month is currently open)
// have ever had this debt item ticked as "paid". Derived live from state.months so it can
// never drift out of sync no matter which months get checked/unchecked or in what order.
function paidMonthCount(debtId){
  return Object.values(state.months).filter(b => b.debtPaid && b.debtPaid[debtId]).length;
}
// Returns null when the item has no installment count set (unlimited/ongoing).
// Otherwise returns the number of installments left, floored at 0 once fully paid off.
function remainingInstallments(item){
  const total = Number(item.totalInstallments || 0);
  if(total <= 0) return null;
  return Math.max(0, total - paidMonthCount(item.id));
}

// Adds n calendar months to a "YYYY-MM" key (Buddhist-era year, but plain integer month math —
// works the same as any other year numbering), rolling over into the next/previous year as needed.
function addMonthsToKey(key, n){
  let [y, m] = key.split("-").map(Number);
  m += n;
  y += Math.floor((m - 1) / 12);
  m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${String(m).padStart(2, "0")}`;
}

// Projects when a debt item will finish, counting forward from anchorKey (the month currently
// open on the debt summary screen). Returns one of:
//   { status: "unlimited" }                          — no installment count was set
//   { status: "done" }                                — already fully paid off
//   { status: "projected", finishKey, paidCount, total, remaining } — still has installments left
function projectDebtFinish(item, anchorKey){
  const remaining = remainingInstallments(item);
  const paidCount = paidMonthCount(item.id);
  if(remaining === null) return { status: "unlimited" };
  if(remaining === 0) return { status: "done", paidCount, total: item.totalInstallments };
  const anchorBucket = ensureMonth(anchorKey);
  const anchorPaid = !!(anchorBucket.debtPaid && anchorBucket.debtPaid[item.id]);
  // If the anchor month is already marked paid, it's already counted inside paidCount/remaining,
  // so we need `remaining` more months after it. Otherwise the anchor month itself still counts
  // as one of the remaining installments, so only (remaining - 1) more months are needed after it.
  const monthsToAdd = anchorPaid ? remaining : remaining - 1;
  const finishKey = addMonthsToKey(anchorKey, monthsToAdd);
  return { status: "projected", finishKey, paidCount, total: item.totalInstallments, remaining };
}

/* ============================= PDF PARSING ============================= */
async function extractLinesFromPdf(arrayBuffer, password){
  const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer, password });
  const doc = await loadingTask.promise;
  let lines = [];
  for(let p=1; p<=doc.numPages; p++){
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const buckets = {};
    for(const item of content.items){
      const y = Math.round(item.transform[5]);
      const x = item.transform[4];
      if(!buckets[y]) buckets[y] = [];
      buckets[y].push({x, str:item.str});
    }
    const ys = Object.keys(buckets).map(Number).sort((a,b)=>b-a);
    for(const y of ys){
      const parts = buckets[y].sort((a,b)=>a.x-b.x);
      const line = parts.map(pt=>pt.str).join(" ").replace(/\s+/g," ").trim();
      if(line) lines.push(line);
    }
  }
  return lines;
}

// Best-effort generic transaction line parser.
// Looks for: [optional date] ... description ... amount (with 2 decimals, optional CR/DR suffix) at end of line.
// Skips lines that are clearly not individual expense items (statement headers/footers,
// balances, credit limit info, "thank you for payment" lines, etc. — see excludeKeywords),
// and flags credit/refund lines (negative amount or explicit "CR") so they are excluded
// from the expense total by default instead of being counted as spending.
function isExcludedLine(line, excludeKeywords){
  const upper = line.toUpperCase();
  return (excludeKeywords||[]).some(kw => kw && upper.includes(kw.toUpperCase()));
}

function parseTransactionLines(lines, excludeKeywords){
  const dateRe = /^(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})\s+/;
  const amountRe = /([\-]?[\d,]+\.\d{2})\s*(CR|DR|cr|dr)?\s*$/;
  const out = [];
  for(const rawLine of lines){
    let line = rawLine.trim();
    if(!line) continue;
    if(isExcludedLine(line, excludeKeywords)) continue; // header/footer/balance/summary line — not a transaction
    const amtMatch = line.match(amountRe);
    if(!amtMatch) continue; // no amount at end -> not a transaction line
    const amount = parseFloat(amtMatch[1].replace(/,/g,""));
    if(isNaN(amount)) continue;
    const flag = (amtMatch[2]||"").toUpperCase();
    const isCredit = flag === "CR" || amtMatch[1].trim().startsWith("-");
    let rest = line.slice(0, amtMatch.index).trim();
    let date = "";
    const dm = rest.match(dateRe);
    if(dm){
      date = dm[1];
      rest = rest.slice(dm[0].length).trim();
    }
    if(!rest) continue; // no description, likely a stray number (e.g. page number)
    out.push({
      id: uid(), date, desc: rest, amount: Math.abs(amount), flag, isCredit,
      category: "", include: !isCredit // credit/refund lines are excluded from the expense total by default
    });
  }
  return out;
}

function autoCategorize(tx){
  const lower = tx.desc.toLowerCase();
  for(const cat of state.categories){
    for(const kw of cat.keywords){
      if(kw && lower.includes(kw.toLowerCase())) return cat.id;
    }
  }
  return "";
}

async function parsePdfWithPasswordRetry(buf, filename){
  let password = undefined;
  for(let attempt=0; attempt<5; attempt++){
    try{
      const lines = await extractLinesFromPdf(buf.slice(0), password);
      const rows = parseTransactionLines(lines, state.excludeKeywords);
      rows.forEach(r=> r.category = autoCategorize(r));
      return rows;
    }catch(err){
      if(err.name === "PasswordException"){
        password = await askPassword(filename);
        if(password === null) throw new Error("ยกเลิกการกรอกรหัสผ่าน");
        continue;
      }
      throw err;
    }
  }
  throw new Error("รหัสผ่านไม่ถูกต้องหลายครั้งเกินไป");
}

    const id = el.dataset.id;
    const row = pendingParsed.find(r=>r.id===id);
    el.addEventListener(el.tagName==="SELECT" || el.type==="checkbox" ? "change" : "input", ()=>{
      const role = el.dataset.role;
      if(role==="del"){ pendingParsed = pendingParsed.filter(r=>r.id!==id); renderReviewTable(); return; }
      if(role==="include") row.include = el.checked;
      else if(role==="amount") row.amount = parseFloat(el.value.replace(/,/g,""))||0;
      else row[role] = el.value;
      if(role==="category"){ renderReviewTable(); return; }
      updateReviewSummaryNote();
    });
  });
  updateReviewSummaryNote();
}

function updateReviewSummaryNote(){
  const included = pendingParsed.filter(r=>r.include);
  const total = included.reduce((s,r)=>s+r.amount,0);
  const uncategorized = included.filter(r=>!r.category).length;
  const excludedCredits = pendingParsed.filter(r=>r.isCredit && !r.include).length;
  document.getElementById("reviewSummaryNote").innerHTML =
    `รวม ${included.length} รายการที่เลือก = <b>${fmt(total)} บาท</b>` +
    (excludedCredits ? ` &nbsp;•&nbsp; <span class="muted">ไม่รวม ${excludedCredits} รายการเครดิต/คืนเงิน</span>` : "") +
    (uncategorized ? ` &nbsp;•&nbsp; <span class="badge-warn">${uncategorized} รายการยังไม่ระบุหมวด</span>` : ` &nbsp;•&nbsp; <span class="badge-ok">ระบุหมวดครบแล้ว</span>`);
}

function commitPending(){
  const key = readMonthPicker("up");
  const included = pendingParsed.filter(r=>r.include && r.desc && r.amount>0);
  if(included.length===0){ showToast("ไม่มีรายการที่จะบันทึก"); return; }
  const bucket = ensureMonth(key);
  included.forEach(r=>{
    bucket.transactions.push({ id: r.id, date:r.date, desc:r.desc, amount:r.amount, category:r.category });
  });
  pendingSourceNames.forEach(name=> bucket.sources.push({ name, uploadedAt: new Date().toISOString() }));
  state.activeMonthKey = key;
  saveState();
  showToast(`บันทึก ${included.length} รายการเข้าเดือน ${monthLabel(key)} แล้ว`);
  pendingParsed = [];
  pendingSourceNames = [];
  document.getElementById("fileChips").innerHTML = "";
  renderReviewTable();
}

// Clickable pills for every real category plus "ยังไม่ระบุหมวด", used to filter the
// transaction list on the Summary tab. Multi-select: click toggles a category in/out;
// "ทั้งหมด" clears back to showing everything.
function categoryFilterPillsHtml(){
  let html = `<span class="filter-pill ${!summaryFilter ? "active" : ""}" data-filter="__all">ทั้งหมด</span>`;
  state.categories.forEach(c=>{
    const active = summaryFilter && summaryFilter.has(c.id);
    html += `<span class="filter-pill ${active ? "active" : ""}" data-filter="${c.id}">${c.name}</span>`;
  });
  const noneActive = summaryFilter && summaryFilter.has("__none");
  html += `<span class="filter-pill ${noneActive ? "active" : ""}" data-filter="__none">ยังไม่ระบุหมวด</span>`;
  return html;
}

function renderSummaryBody(key){
  const box = document.getElementById("summaryBody");
  const bucket = state.months[key];
  if(!bucket || bucket.transactions.length===0){
    box.innerHTML = `<div class="card empty">ยังไม่มีข้อมูลค่าใช้จ่ายของเดือน ${monthLabel(key)} — ไปที่แท็บ "อัปโหลด Statement" เพื่อเพิ่มข้อมูล</div>`;
    return;
  }
  const { totals, grand } = computeCategoryTotals(bucket);
  const catRows = state.categories.filter(c=>!(c.splitInto && c.splitInto.length)).map(c=>({id:c.id, name:c.name, total: totals[c.id]||0}));
  if(totals["__none"]) catRows.push({id:"__none", name:"ยังไม่ระบุหมวด", total: totals["__none"]});
  const max = Math.max(...catRows.map(c=>c.total), 1);

  let html = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">เดือน</div><div class="value" style="font-size:16px;">${monthLabel(key)}</div></div>
      <div class="stat-card"><div class="label">ยอดรวมทั้งหมด</div><div class="value">${fmt(grand)} ฿</div></div>
      <div class="stat-card"><div class="label">จำนวนรายการ</div><div class="value">${bucket.transactions.length}</div></div>
    </div>
    <div class="card">
      <h3>สัดส่วนตามหมวดหมู่</h3>
      ${catRows.map(c=>`
        <div class="bar-row">
          <div class="bar-label">${c.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(c.total/max*100).toFixed(1)}%"></div></div>
          <div class="bar-amount">${fmt(c.total)} ฿</div>
        </div>`).join("")}
    </div>
    <div class="card">
      <h3>กรองตามหมวดหมู่</h3>
      <div id="summaryFilterPills">${categoryFilterPillsHtml()}</div>
    </div>
    <div class="card">
      <div class="toolbar"><h3 style="margin:0;">รายการทั้งหมด</h3></div>
      <div class="small-note" id="filterCountNote" style="margin-bottom:8px;"></div>

        <thead><tr><th>วันที่</th><th>รายการ</th><th class="num">ยอด</th><th>หมวด</th><th></th></tr></thead>
        <tbody id="txListBody"></tbody>
      </table>
    </div>
  `;
  box.innerHTML = html;

    pill.addEventListener("click", ()=>{

      if(val === "__all"){
        summaryFilter = null;

        if(!summaryFilter) summaryFilter = new Set();
        if(summaryFilter.has(val)) summaryFilter.delete(val); else summaryFilter.add(val);

function renderTxList(bucket, key){

function renderDebtTimeline(anchorKey){
  const timelineBox = document.getElementById("debtTimelineBox");
  const projections = state.debtItems.map(d => ({ item: d, proj: projectDebtFinish(d, anchorKey) }));

  timelineBox.innerHTML = projections.map(({ item, proj }) => {
    let fillClass = "", fillWidth = "0%", metaText = "";
    if(proj.status === "unlimited"){
      fillClass = "unlimited";
      fillWidth = "100%";
      metaText = "🔁 ผ่อนต่อเนื่อง ไม่ได้ระบุจำนวนงวด — ไม่มีกำหนดสิ้นสุด";
    } else if(proj.status === "done"){
      fillClass = "done";
      fillWidth = "100%";
      metaText = `✅ จ่ายครบ ${proj.total} / ${proj.total} งวดแล้ว`;
    } else {
      fillWidth = `${Math.min(100, (proj.paidCount / proj.total) * 100).toFixed(1)}%`;
      metaText = `จ่ายไปแล้ว ${proj.paidCount} จาก ${proj.total} งวด • เหลืออีก ${proj.remaining} งวด`;
    }
    const finishHtml = proj.status === "projected"
      ? `คาดว่าจะหมดประมาณ <b>${monthLabel(proj.finishKey)}</b>`
      : (proj.status === "done" ? "หมดแล้ว" : "ไม่มีกำหนด");
    return `
      <div class="debt-timeline-row">
        <div class="debt-timeline-header">
          <span class="name">${item.name}</span>
          <span class="finish">${finishHtml}</span>
        </div>
        <div class="debt-timeline-track"><div class="debt-timeline-fill ${fillClass}" style="width:${fillWidth}"></div></div>
        <div class="debt-timeline-meta">${metaText}</div>
      </div>
    `;
  }).join("") || `<div class="empty">ยังไม่มีรายการหนี้ — ไปตั้งค่าที่แท็บ "ตั้งค่าหนี้ประจำเดือน"</div>`;

  // Sorted "who finishes first" list — only items with a concrete projected finish date.
  const finishList = document.getElementById("finishOrderList");
  const withDates = projections
    .filter(({ proj }) => proj.status === "projected")
    .sort((a, b) => a.proj.finishKey.localeCompare(b.proj.finishKey));

  let html = withDates.map(({ item, proj }, idx) => `
    <li>
      <span class="rank">${idx + 1}</span>
      <span class="fname">${item.name}</span>
      <span class="fdate">${monthLabel(proj.finishKey)}</span>
    </li>
  `).join("");

  const doneNames = projections.filter(({ proj }) => proj.status === "done").map(({ item }) => item.name);
  const unlimitedNames = projections.filter(({ proj }) => proj.status === "unlimited").map(({ item }) => item.name);
  if(doneNames.length){
    html += `<li><span class="rank" style="background:#ecfdf5; color:var(--green);">✓</span><span class="fname muted">${doneNames.join(", ")}</span><span class="fdate muted" style="font-weight:400;">หมดแล้ว</span></li>`;
  }
  if(unlimitedNames.length){
    html += `<li><span class="rank" style="background:#eef2f7; color:var(--muted);">∞</span><span class="fname muted">${unlimitedNames.join(", ")}</span><span class="fdate muted" style="font-weight:400;">ไม่มีกำหนด</span></li>`;
  }
  finishList.innerHTML = html || `<li class="muted">ยังไม่มีข้อมูล</li>`;
}

// Reusable across the debt summary tab and here: describes each debt item's current
// installment number ("งวดที่ X / Y") and whether it still counts toward totals this month.
function getDebtItemsInfo(){
  return state.debtItems.map(d=>{
    const remaining = remainingInstallments(d);
    const paidCount = paidMonthCount(d.id);
    let label;
    if(remaining === null) label = "ไม่จำกัด";
    else if(remaining === 0) label = "ผ่อนครบแล้ว";
    // Same "remaining / total งวด" wording as the debt summary tab, so both screens
    // always agree on this item's progress instead of showing two different-looking numbers.
    else label = `${remaining} / ${d.totalInstallments} งวด`;
    return { item: d, remaining, paidCount, label, contributes: remaining !== 0 };
  });
}

function renderNatFinanceBody(key){

    el.addEventListener("change", ()=>{
      bucket.natFinance.income.find(r=>r.id===el.dataset.incAmt).amount = parseFloat(el.value.replace(/,/g,""))||0;
      saveState(); renderNatFinanceBody(key);
    });
  });
  incomeBody.querySelectorAll("[data-inc-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      bucket.natFinance.income = bucket.natFinance.income.filter(r=>r.id!==btn.dataset.incDel);
      saveState(); renderNatFinanceBody(key);
    });
  });

  // --- Auto: Nat's category total from the monthly summary (read-only reference row) ---
  document.getElementById("natAutoExpenseBody").innerHTML = `
    <tr>
      <td>ค่าใช้จ่ายของนัทคนเดียว <span class="small-note">(ดึงจากหมวดหมู่ "นัทคนเดียว" อัตโนมัติ — แก้ไขได้ที่แท็บ "สรุปค่าใช้จ่ายรายเดือน")</span></td>
      <td class="num">${fmt(autoNatExpense)}</td>
    </tr>
  `;

  // --- Auto: debt items from the debt settings/summary, each with its current installment number ---
  document.getElementById("natAutoDebtBody").innerHTML = debtInfo.map(({ item, label, contributes }) => `
    <tr${contributes ? "" : ' style="opacity:.55;"'}>
      <td>${item.name}</td>
      <td class="num">${contributes ? fmt(Number(item.amount||0)) : "-"}</td>
      <td>${label === "ผ่อนครบแล้ว" ? `<span class="badge-ok">${label}</span>` : (label === "ไม่จำกัด" ? `<span class="muted">${label}</span>` : label)}</td>
    </tr>
  `).join("") || `<tr><td colspan="3" class="muted">ยังไม่มีรายการหนี้ตั้งค่าไว้</td></tr>`;

  // --- Custom expenses (fully user-entered) ---
  const customBody = document.getElementById("natCustomExpBody");
  customBody.innerHTML = bucket.natFinance.customExpenses.map(r => `
    <tr>
      <td><input class="inline-edit" value="${r.desc}" data-exp-desc="${r.id}" placeholder="เช่น ค่าตัดผม"></td>
      <td class="num"><input class="inline-edit" style="text-align:right" value="${r.amount}" data-exp-amt="${r.id}"></td>
      <td><button class="ghost" data-exp-del="${r.id}">✕</button></td>
    </tr>
  `).join("");
  document.getElementById("customExpEmptyNote").textContent = bucket.natFinance.customExpenses.length ? "" : "ยังไม่มีรายจ่ายเพิ่มเติม — กด \"+ เพิ่มรายจ่าย\" ด้านบน";
  customBody.querySelectorAll("[data-exp-desc]").forEach(el=>{
    el.addEventListener("change", ()=>{
      bucket.natFinance.customExpenses.find(r=>r.id===el.dataset.expDesc).desc = el.value;
      saveState();
    });
  });
  customBody.querySelectorAll("[data-exp-amt]").forEach(el=>{
    el.addEventListener("change", ()=>{
      bucket.natFinance.customExpenses.find(r=>r.id===el.dataset.expAmt).amount = parseFloat(el.value.replace(/,/g,""))||0;
      saveState(); renderNatFinanceBody(key);
    });
  });
  customBody.querySelectorAll("[data-exp-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      bucket.natFinance.customExpenses = bucket.natFinance.customExpenses.filter(r=>r.id!==btn.dataset.expDel);
      saveState(); renderNatFinanceBody(key);
    });
  });
}

/* ============================= CATEGORY SETTINGS TAB ============================= */
function renderCategories(main){
  main.innerHTML = `
    <h2 class="page-title">ตั้งค่าหมวดหมู่ค่าใช้จ่าย</h2>
    <p class="page-desc">กำหนดคำค้นหา (keyword) สำหรับแต่ละหมวด ระบบจะจับคู่รายการจาก statement เข้าหมวดโดยอัตโนมัติเมื่อพบคำที่ตรงกันในคำอธิบายรายการ (ไม่สนตัวพิมพ์เล็ก-ใหญ่)</p>
    <div class="card">
      <div class="toolbar"><h3 style="margin:0;">หมวดหมู่ทั้งหมด</h3>
        <div class="row" style="gap:8px;">
          <input type="text" id="newCatName" placeholder="ชื่อหมวดใหม่" style="width:200px">
          <button id="addCatBtn">+ เพิ่มหมวด</button>
        </div>
      </div>
      <div id="catList"></div>
    </div>

    <div class="card">
      <h3>บรรทัดที่ไม่ต้องนำเข้า (ไม่ใช่รายการค่าใช้จ่าย)</h3>
      <p class="small-note" style="margin-top:-6px;">เมื่ออ่าน statement ถ้าบรรทัดมีคำเหล่านี้ ระบบจะข้ามไปเลย ไม่ดึงเข้ามาเป็นรายการ — ใช้สำหรับกันบรรทัดยอดยกมา ยอดคงเหลือ วงเงิน หรือหัว-ท้ายเอกสารที่ไม่ใช่รายการใช้จ่ายจริง เพิ่มคำใหม่ได้เองถ้าเจอบรรทัดหลุดเข้ามา</p>
      <div id="excludeKwBox"></div>
      <div class="row" style="margin-top:10px;">
        <input type="text" id="excludeKwInput" placeholder="เพิ่มคำ เช่น ยอดคงเหลือ" style="width:240px">
        <button class="secondary" id="addExcludeKwBtn">+ เพิ่มคำ</button>
      </div>
    </div>
  `;
  renderCatList();
  renderExcludeKwList();
  document.getElementById("addCatBtn").addEventListener("click", ()=>{
    const nameInput = document.getElementById("newCatName");
    const name = nameInput.value.trim();
    if(!name) return;
    state.categories.push({ id: uid(), name, keywords: [] });
    saveState(); nameInput.value=""; renderCatList();
  });
  document.getElementById("addExcludeKwBtn").addEventListener("click", ()=>{
    const input = document.getElementById("excludeKwInput");
    const val = input.value.trim();
    if(!val) return;
    state.excludeKeywords.push(val);
    saveState(); input.value=""; renderExcludeKwList();
  });
}

function renderExcludeKwList(){
  const box = document.getElementById("excludeKwBox");
  box.innerHTML = state.excludeKeywords.map((kw,idx)=>
    `<span class="keyword-tag">${kw}<button data-delexkw="${idx}">✕</button></span>`
  ).join("") || `<span class="muted">ยังไม่มีคำที่กันไว้</span>`;
  box.querySelectorAll("[data-delexkw]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.excludeKeywords.splice(parseInt(btn.dataset.delexkw,10),1);
      saveState(); renderExcludeKwList();
    });
  });
}

function renderCatList(){
  const box = document.getElementById("catList");
  box.innerHTML = state.categories.map(cat=>{
    const isSplit = cat.splitInto && cat.splitInto.length;
    const splitBadge = isSplit ? `<div class="small-note" style="margin-bottom:8px;">🔀 หมวดพิเศษ: รายการที่เลือกหมวดนี้จะถูกหารเท่า ๆ กันแล้วนำไปรวมใน ${cat.splitInto.map(id=>{const c=state.categories.find(cc=>cc.id===id); return c?c.name:id;}).join(" + ")} โดยอัตโนมัติ (ไม่แสดงยอดสะสมของหมวดนี้เอง)</div>` : "";
    return `
    <div class="card" style="margin-bottom:12px; background:#fafbfc;">
      <div class="toolbar">
        <input class="inline-edit" style="font-weight:700; font-size:14px;" value="${cat.name}" data-rename="${cat.id}">
        <button class="danger" data-delcat="${cat.id}">ลบหมวดนี้</button>
      </div>
      ${splitBadge}
      <div id="kwbox-${cat.id}">
        ${cat.keywords.map((kw,idx)=>`<span class="keyword-tag">${kw}<button data-delkw="${cat.id}|${idx}">✕</button></span>`).join("")}
      </div>
      <div class="row" style="margin-top:10px;">
        <input type="text" id="kwinput-${cat.id}" placeholder="เพิ่มคำค้นหา เช่น TRUE MOVE H" style="width:240px">
        <button class="secondary" data-addkw="${cat.id}">+ เพิ่มคำค้นหา</button>
      </div>
    </div>
  `;
  }).join("");

  box.querySelectorAll("[data-rename]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const cat = state.categories.find(c=>c.id===el.dataset.rename);
      cat.name = el.value.trim() || cat.name;
      saveState();
    });
  });
  box.querySelectorAll("[data-delcat]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!confirm("ลบหมวดนี้? รายการที่เคยอยู่หมวดนี้จะกลายเป็น 'ยังไม่ระบุหมวด'")) return;
      state.categories = state.categories.filter(c=>c.id!==btn.dataset.delcat);
      saveState(); renderCatList();
    });
  });
  box.querySelectorAll("[data-addkw]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const catId = btn.dataset.addkw;
      const input = document.getElementById(`kwinput-${catId}`);
      const val = input.value.trim();
      if(!val) return;
      state.categories.find(c=>c.id===catId).keywords.push(val);
      saveState(); renderCatList();
    });
  });
  box.querySelectorAll("[data-delkw]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [catId, idx] = btn.dataset.delkw.split("|");
      state.categories.find(c=>c.id===catId).keywords.splice(parseInt(idx,10),1);
      saveState(); renderCatList();
    });
  });
}

/* ============================= DEBT SETTINGS TAB ============================= */
function renderDebtSettings(main){
  main.innerHTML = `
    <h2 class="page-title">ตั้งค่าหนี้ประจำเดือน</h2>
    <p class="page-desc">ยอดเหล่านี้เป็นยอดผ่อนชำระคงที่ ไม่ได้อ่านจากไฟล์ statement — กรอกครั้งเดียว ระบบจะใช้ยอดเดียวกันทุกเดือน ใส่ "จำนวนงวดทั้งหมด" ได้ด้วย (เว้นว่างหรือ 0 = ไม่จำกัด/ผ่อนไปเรื่อย ๆ) — เมื่อไปติ๊ก "ชำระแล้ว" ที่หน้าสรุปหนี้ในเดือนไหน จำนวนงวดที่เหลือจะลดลงอัตโนมัติ และเมื่อครบจำนวนงวดแล้วรายการนั้นจะไม่ถูกนับรวมในยอดหนี้อีกต่อไป</p>
    <div class="card">
      <div class="toolbar"><h3 style="margin:0;">รายการหนี้</h3>
        <div class="row" style="gap:8px;">
          <input type="text" id="newDebtName" placeholder="ชื่อรายการหนี้ใหม่" style="width:200px">
          <button id="addDebtBtn">+ เพิ่มรายการ</button>
        </div>
      </div>
      <table>
        <thead><tr><th>รายการ</th><th class="num">ยอดต่อเดือน (บาท)</th><th class="num">จำนวนงวดทั้งหมด</th><th>งวดที่เหลือ</th><th></th></tr></thead>
        <tbody id="debtSettingsBody"></tbody>
      </table>
    </div>
  `;
  renderDebtSettingsBody();
  document.getElementById("addDebtBtn").addEventListener("click", ()=>{
    const input = document.getElementById("newDebtName");
    const name = input.value.trim();
    if(!name) return;
    state.debtItems.push({ id: uid(), name, amount: 0, totalInstallments: 0 });
    saveState(); input.value=""; renderDebtSettingsBody();
  });
}
function renderDebtSettingsBody(){
  const body = document.getElementById("debtSettingsBody");
  body.innerHTML = state.debtItems.map(d=>{
    const remaining = remainingInstallments(d);
    const remainingHtml = remaining === null
      ? `<span class="muted">ไม่จำกัด</span>`
      : (remaining === 0 ? `<span class="badge-ok">ผ่อนครบแล้ว</span>` : `${remaining} / ${d.totalInstallments} งวด`);
    return `
    <tr>
      <td><input class="inline-edit" value="${d.name}" data-debtname="${d.id}"></td>
      <td class="num"><input class="inline-edit" style="text-align:right" value="${d.amount}" data-debtamt="${d.id}"></td>
      <td class="num"><input class="inline-edit" style="text-align:right" value="${d.totalInstallments||0}" data-debtinst="${d.id}" placeholder="0 = ไม่จำกัด"></td>
      <td>${remainingHtml}</td>
      <td><button class="ghost" data-debtdel="${d.id}">✕</button></td>
    </tr>
  `;
  }).join("");
  body.querySelectorAll("[data-debtname]").forEach(el=>{
    el.addEventListener("change", ()=>{
      state.debtItems.find(d=>d.id===el.dataset.debtname).name = el.value.trim();
      saveState();
    });
  });
  body.querySelectorAll("[data-debtamt]").forEach(el=>{
    el.addEventListener("change", ()=>{
      state.debtItems.find(d=>d.id===el.dataset.debtamt).amount = parseFloat(el.value.replace(/,/g,""))||0;
      saveState();
    });
  });
  body.querySelectorAll("[data-debtinst]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const val = parseInt(el.value, 10);
      state.debtItems.find(d=>d.id===el.dataset.debtinst).totalInstallments = isNaN(val) || val < 0 ? 0 : val;
      saveState();
      renderDebtSettingsBody(); // refresh so "งวดที่เหลือ" reflects the new total immediately
    });
  });
  body.querySelectorAll("[data-debtdel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!confirm("ลบรายการหนี้นี้?")) return;
      state.debtItems = state.debtItems.filter(d=>d.id!==btn.dataset.debtdel);
      saveState(); renderDebtSettingsBody();
    });
  });
}

/* ============================= HISTORY TAB ============================= */
function renderHistory(main){
  const keys = Object.keys(state.months).sort().reverse();
  main.innerHTML = `
    <h2 class="page-title">ประวัติทั้งหมด</h2>
    <p class="page-desc">ทุกเดือนที่เคยบันทึกข้อมูลไว้ในระบบ</p>
    <div class="card">
      ${keys.length===0 ? `<div class="empty">ยังไม่มีข้อมูล</div>` : `
      <table>
        <thead><tr><th>เดือน</th><th class="num">จำนวนรายการ</th><th class="num">ยอดรวม (บาท)</th><th>ไฟล์ที่อัปโหลด</th><th></th></tr></thead>
        <tbody>
          ${keys.map(k=>{
            const b = state.months[k];
            const total = b.transactions.reduce((s,t)=>s+t.amount,0);
            return `<tr>
              <td><b>${monthLabel(k)}</b></td>
              <td class="num">${b.transactions.length}</td>
              <td class="num">${fmt(total)}</td>
              <td>${b.sources.map(s=>`<span class="pill">${s.name}</span>`).join(" ") || "-"}</td>
              <td><button class="ghost" data-viewmonth="${k}">ดูสรุป →</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`}
    </div>
  `;
  main.querySelectorAll("[data-viewmonth]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.activeMonthKey = btn.dataset.viewmonth;
      saveState();
      document.querySelectorAll("nav .tab").forEach(t=>t.classList.remove("active"));
      document.querySelector('nav .tab[data-tab="summary"]').classList.add("active");
      currentTab = "summary";
      render();
    });
  });
}

if(rememberedPin){
  connectRoom(rememberedPin);
} else {
  showPinGate();
}
